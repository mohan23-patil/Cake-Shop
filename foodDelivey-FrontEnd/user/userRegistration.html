<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title> User | Login / Register - Cake Shop</title>

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #d5fefd, #fed6e3);
      font-family: 'Segoe UI', sans-serif;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .navbar {
      background: transparent !important;
      box-shadow: none;
      margin-bottom: 30px;
    }

    .form-container {
      max-width: 400px;
      margin: auto;
      padding: 30px;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .form-container h4 {
      color: #ff5722;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-control {
      border-radius: 10px;
      border: 1px solid #ddd;
      padding: 10px 15px;
      margin-bottom: 15px;
    }

    .btn-custom {
      width: 100%;
      border-radius: 10px;
      font-weight: bold;
    }

    .toggle-link {
      cursor: pointer;
      color: #ff5722;
      text-decoration: none;
    }

    .toggle-link:hover {
      text-decoration: underline;
    }

    footer {
      background: #fff3f3;
      text-align: center;
      padding: 15px 0;
      font-weight: 500;
      position: sticky;
      bottom: 0;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="content">
    <!-- ===== NAVBAR ===== -->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold text-danger fs-3">🎂 Cake_Shop</a>
      </div>
    </nav>

    <!-- ===== LOGIN FORM ===== -->
    <div id="loginForm" class="form-container">
      <h4><i class="bi bi-box-arrow-in-right"></i> Login</h4>
      <form id="login">
        <input type="text" class="form-control" name="username" placeholder="Username" required />
        <input type="password" class="form-control" name="password" placeholder="Password" required />
        <button type="submit" class="btn btn-success btn-custom"><i class="bi bi-box-arrow-in-right"></i> Login</button>
        <p class="text-center mt-2">
          Don't have an account? <span class="toggle-link" onclick="showRegister()">Register here</span>
        </p>
      </form>
    </div>

    <!-- ===== REGISTER FORM ===== -->
    <div id="registerForm" class="form-container" style="display:none;">
      <h4><i class="bi bi-person-plus-fill"></i> Register</h4>
      <form id="register">
        <input type="text" class="form-control" name="name" placeholder="Full Name" required />
        <input type="text" class="form-control" name="mobile" placeholder="Mobile Number" required />
        <input type="text" class="form-control" name="address" placeholder="Address" required />
        <input type="text" class="form-control" name="username" placeholder="Username" required />
        <input type="password" class="form-control" name="password" placeholder="Password" required />
        <button type="submit" class="btn btn-primary btn-custom"><i class="bi bi-person-plus"></i> Register</button>
        <p class="text-center mt-2">
          Already have an account? <span class="toggle-link" onclick="showLogin()">Login here</span>
        </p>
      </form>
    </div>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p>🎂 Cake_Shop – Delicious moments made sweet!</p>
    <p>© 2025 Cake Shop. All rights reserved.</p>
  </footer>

  <!-- ===== SCRIPTS ===== -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function showRegister() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
    }
    function showLogin() {
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('registerForm').style.display = 'none';
    }

    const BASE_URL = "http://localhost:8081/user/auth";

    function showPopup(message, type='success') {
      Swal.fire({
        icon: type,
        title: message,
        showConfirmButton: false,
        timer: 1500
      });
    }

    document.getElementById('login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());
      try {
        const res = await fetch(`${BASE_URL}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if(result.success){
          localStorage.setItem('loggedUser', JSON.stringify(result.user));
          showPopup(result.message, 'success');
          setTimeout(()=>window.location.href="/user/userHome.html", 1500);
        } else showPopup("Invalid Credentials!", 'error');
      } catch(err) {
        console.error(err);
        showPopup("Login failed!", 'error');
      }
    });

    document.getElementById('register').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());
      try {
        const res = await fetch(`${BASE_URL}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if(result.success){
          showPopup(result.message, 'success');
          setTimeout(showLogin, 1500);
        } else showPopup("Registration failed!", 'error');
      } catch(err) {
        console.error(err);
        showPopup("Registration failed!", 'error');
      }
    });
  </script>
</body>
</html>
