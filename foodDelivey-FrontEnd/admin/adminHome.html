<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            background: linear-gradient(135deg, #d5fefd, #fed6e3);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-nav .nav-link:hover {
            font-size: 1.2rem;
            transition: font-size 0.3s ease;
        } 
        .dashboard-card {
            border-radius: 20px;
            background: #e0e5ec;
            box-shadow: 10px 10px 20px #a3b1c6, -10px -10px 20px #ffffff;
            transition: transform 0.2s ease-in-out;
        }
        .dashboard-card:hover { transform: translateY(-6px); }
        .dashboard-icon { font-size: 40px; color: #0d6efd; margin-bottom: 10px; text-shadow: 1px 1px 2px #fff; }
        .dashboard-card h5 { font-weight: 600; color: #333; }
        .dashboard-card h3 { font-size: 2rem; font-weight: bold; color: #ff5722; }
        .footer { background: linear-gradient(135deg, #d5fefd, #fed6e3); color: black; padding: 20px 0; text-align: center; margin-top: auto; }
        .btn:hover { transform: scale(1.05); transition: all 0.2s ease-in-out; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg" style=" background: linear-gradient(135deg, #d5fefd, #fed6e3);">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold text-danger fs-3">🎂 Cake_Shop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link active fw-bold text-danger" href="#"><i class="fa-solid fa-house"></i> Home</a></li>
                <li class="nav-item"><a class="nav-link fw-bold" href="/admin/viewAllCake.html"><i class="fa-solid fa-cake-candles"></i> Cakes</a></li>
                <li class="nav-item"><a class="nav-link fw-bold" href="/admin/Order.html"><i class="fa-solid fa-truck"></i> Orders</a></li>
                <li class="nav-item"><a class="nav-link fw-bold" href="/admin/UserLogin.html"><i class="fa-solid fa-users"></i> Users</a></li>
                <li class="nav-item"><a class="nav-link text-success fw-bold" href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Dashboard Content -->
<div class="container my-5">
    <h2 class="text-center mb-4">Welcome, Admin!</h2>

    <div class="row g-4">
        <div class="col-md-4">
            <div class="card dashboard-card text-center p-4">
                <i class="fa-solid fa-cake-candles dashboard-icon"></i>
                <h5 class="mt-3">Total Cakes</h5>
                <h3 id="cakeCount">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-card text-center p-4">
                <i class="fa-solid fa-cart-shopping dashboard-icon"></i>
                <h5 class="mt-3">Orders</h5>
                <h3 id="orderCount">0</h3>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-card text-center p-4">
                <i class="fa-solid fa-users dashboard-icon"></i>
                <h5 class="mt-3">Users</h5>
                <h3 id="userCount">0</h3>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="mt-5 d-flex justify-content-center gap-3 flex-wrap">
        <a href="/admin/addCake.html" class="btn btn-success"><i class="fa-solid fa-plus"></i> Add New Cake</a>
        <a href="/admin/viewAllCake.html" class="btn btn-info text-white"><i class="fa-solid fa-list"></i> View Cakes</a>
        <a href="/admin/Order.html" class="btn btn-warning text-dark"><i class="fa-solid fa-eye"></i> View Orders</a>
    </div>
</div>

<!-- Footer -->
<div class="footer fw-bold">&copy; 2025 Cake Shop. All rights reserved.</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
const BASE_URL = "http://localhost:8081/admin";

// Redirect to login if not logged in
if (localStorage.getItem("adminLoggedIn") !== "true") {
    Swal.fire({
        icon: 'warning',
        title: 'Not Logged In',
        text: 'Please login to access the dashboard',
        confirmButtonText: 'Go to Login'
    }).then(() => {
        window.location.href = "/admin/registration.html";
    });
}

// Fetch counts from backend
async function fetchCounts() {
    try {
        const res = await fetch(`${BASE_URL}/counts`);
        const data = await res.json();
        document.getElementById("cakeCount").textContent = data.cakes;
        document.getElementById("orderCount").textContent = data.orders;
        document.getElementById("userCount").textContent = data.users;
    } catch (err) {
        console.error(err);
        Swal.fire({
            icon: 'error',
            title: 'Error!',
            text: 'Failed to fetch counts from server'
        });
    }
}

fetchCounts();

// Logout function with confirmation
function logout() {
    Swal.fire({
        title: 'Are you sure?',
        text: "You will be logged out from the admin dashboard.",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d33',
        cancelButtonColor: '#3085d6',
        confirmButtonText: 'Yes, logout!',
        cancelButtonText: 'Cancel'
    }).then((result) => {
        if (result.isConfirmed) {
            localStorage.removeItem("adminLoggedIn");
            Swal.fire({
                icon: 'success',
                title: 'Logged Out!',
                text: 'You have been logged out successfully',
                timer: 1500,
                showConfirmButton: false
            }).then(() => {
                window.location.href = "/admin/registration.html";
            });
        }
    });
}
</script>
</body>
</html>
