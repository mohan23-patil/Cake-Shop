<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cake Shop | Welcome</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { display:flex; justify-content:center; align-items:center; height:100vh; background: linear-gradient(135deg,#fff1eb,#ace0f9);}
.container{ text-align:center; }
button{ margin:10px; width:200px;}
</style>
</head>
<body>
<div class="container">
<h1>🎂 Welcome to Cake Shop</h1>
<button class="btn btn-success" onclick="loginAdmin()">Admin</button>
<button class="btn btn-primary" onclick="loginUser()">User</button>
</div>

<script>
function loginAdmin(){
    window.location.href="/admin/registration.html";
}
function loginUser(){
    window.location.href="/user/userRegistration.html";
}

// Auto redirect if already logged in
const isAdmin = localStorage.getItem("adminLoggedIn");
const user = JSON.parse(localStorage.getItem("loggedUser"));
if(isAdmin){
    window.location.href="/admin/adminHome.html";
} else if(user){
    window.location.href="/user/userHome.html";
}
</script>
</body>
</html>
